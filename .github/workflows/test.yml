name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Run tests
        run: python -m unittest test_generate_nav -v
